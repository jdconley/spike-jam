# A tiny simulator app that shows SpikeArtDemoView, for screenshots of the placeholder art.
#   cd Packages/SpikeArt/Demo && xcodegen
#   xcodebuild build -project SpikeArtDemo.xcodeproj -scheme SpikeArtDemo \
#     -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -derivedDataPath build
# The generated project is not checked in.
name: SpikeArtDemo
options:
  bundleIdPrefix: com.conleychaos
  deploymentTarget:
    iOS: "26.0"
packages:
  SpikeArt:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  SpikeArtDemo:
    type: application
    platform: iOS
    sources: [SpikeArtDemo]
    dependencies:
      - package: SpikeArt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.spikeartdemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SpikeArt
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
