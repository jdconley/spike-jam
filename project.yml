name: SpikeJam
options:
  bundleIdPrefix: com.conleychaos
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: B222J9J7B8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SpikeCore:
    path: Packages/SpikeCore
  SpikeArt:
    path: Packages/SpikeArt
  SpikeNet:
    path: Packages/SpikeNet
targets:
  # The app: App/ on SpikeCore (the game) and SpikeArt (the placeholder look). TestFlight ships it.
  SpikeJam:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SpikeCore
      - package: SpikeArt
      - package: SpikeNet
    scheme:
      testTargets: [SpikeJamTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.spikejam
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spike Jam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Spike Jam
        # The build number comes from CURRENT_PROJECT_VERSION, which scripts/testflight.sh overrides.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption beyond what the OS provides: TestFlight asks no export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # ProMotion: let CADisplayLink ask for 120 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarHidden: true
        GCSupportsControllerUserInteraction: true
  SpikeJamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SpikeJam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conleychaos.spikejam.tests
        GENERATE_INFOPLIST_FILE: YES
